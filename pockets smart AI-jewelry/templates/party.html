<html><head><link rel="stylesheet" href="/static/style.css"></head><body style="background:#5a5cff; padding:20px; font-family:sans-serif;"><div style="background:white; padding:20px; border-radius:15px; max-width:600px; margin:auto;"><h2>Party Planner Da! 🎉</h2><form method="post"><input type="number" name="budget" value="{{ budget }}" placeholder="60000" style="padding:8px; width:70%; border-radius:6px; border:1px solid #ccc;"><button type="submit" style="background:#5a5cff; color:white; padding:8px 15px; border:none; border-radius:6px;">Find My Ideas</button></form><hr><h3>Budget: Rs. {{ budget }}/-</h3>{% for name, price, desc in ideas %}<div style="background:#e6f0ff; padding:12px; border-radius:10px; margin:10px 0;"><b>{{ loop.index }}. {{ name }} - {{ price }}</b><br><small>{{ desc }}</small></div>{% endfor %}<br><a href="/dashboard">Back to Dashboard</a></div></body></html>
